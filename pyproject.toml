[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowwriter-studio"
version = "0.9.0"
description = "Select text in any app and rewrite it with any AI model. Open-source, local-first desktop writing assistant."
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "writing", "desktop", "pyside6", "ollama", "openai-compatible", "text"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.10,<6.13",
  "httpx>=0.27,<1.0",
  "pynput>=1.7.7,<2",
  "cryptography>=44,<49",
  "keyring>=25,<27"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.14,<7"]

[project.gui-scripts]
flowwriter-studio = "flowwriter.__main__:main"

[tool.setuptools.packages.find]
include = ["flowwriter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
