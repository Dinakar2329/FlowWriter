name: FlowWriter test and native bundles
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']          # pushing a tag such as v0.9.0 also publishes a GitHub Release
  pull_request:

# The build only reads the repository; nothing here needs to write to it.
permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Actions are pinned to full commit hashes, not moving tags. To update one, look up
      # the new release's commit and change the hash and the comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux native display prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1 xclip
      - name: Install dependencies (exact versions, hashes verified)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Unit and offscreen UI tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short tests 2>&1 | tee pytest.log
      - name: Show failing tests in the run summary
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while IFS= read -r line; do echo "::error title=Test failed::${line:0:400}"; done
          { echo '### Failing tests'; echo '```'; grep -E "^(FAILED|ERROR)" pytest.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Package for this OS
        run: python scripts/build_release.py
      # Zipped here, not by upload-artifact, so macOS and Linux keep their executable permissions.
      - name: Zip the bundle
        run: python -c "import shutil; shutil.make_archive('FlowWriterStudio-${{ runner.os }}', 'zip', 'dist')"
      - name: Publish unsigned build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlowWriterStudio-${{ matrix.os }}
          path: FlowWriterStudio-${{ runner.os }}.zip

  # Runs only for version tags, and only after the tests and builds on all three systems passed.
  release:
    needs: test-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the only job that may write: it creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: FlowWriterStudio-*
          merge-multiple: true
          path: release-files
      - name: Create a pre-release with the builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            Unsigned preview builds. Windows is the tested platform; macOS and Linux builds are experimental.
            Windows may show a SmartScreen warning because the app is not code-signed.
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/*.zip --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --notes "$NOTES"
